name: multiparking_tower
description: MultiParking hub — Multi-Level Tower and Open Space Parking in one app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Embedded Open Space module
  open_space_parking:
    path: packages/open_space_parking

  # State & Navigation
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  get_it: ^8.0.2

  # Networking
  dio: ^5.8.0+1
  pretty_dio_logger: ^1.4.0
  connectivity_plus: ^6.1.4
  http: ^1.2.2

  # Storage
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3
  path_provider: ^2.1.6

  # Auth & Notifications
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.2
  firebase_messaging: ^15.2.5
  flutter_local_notifications: ^18.0.1
  google_sign_in: ^6.2.2

  # Payments
  razorpay_flutter: ^1.4.0

  # UI & Media
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.10
  flutter_svg: ^2.0.17
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  lottie: ^3.3.1
  google_fonts: ^6.2.1
  image_picker: ^1.2.3
  file_picker: ^8.1.2
  fl_chart: ^0.69.0
  google_maps_flutter: ^2.9.0
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  webview_flutter: ^4.10.0
  url_launcher: ^6.3.0
  pdf: ^3.13.0

  # Utils
  intl: ^0.20.2
  logger: ^2.5.0
  permission_handler: ^11.4.0
  equatable: ^2.0.7
  uuid: ^4.5.1
  collection: ^1.19.1
  crypto: ^3.0.6
  geolocator: ^13.0.1
  mongo_dart: ^0.10.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
    - assets/icons/
